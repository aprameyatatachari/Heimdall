name: Deploy

# The release pipeline. Everything is gated: nothing reaches production unless
# every check before it passed, and the schema is migrated before the code that
# depends on it is promoted.
#
# The gates are repeated here rather than inherited from the Backend and
# Frontend workflows on purpose. A release is the one place where "it passed on
# some earlier commit" is not good enough, and `workflow_run` would let a green
# run from a different commit stand in for this one.
#
# Secrets this workflow needs, all set in the repository's `production`
# environment so they cannot be read from a pull request:
#
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   DATABASE_URL_DIRECT   the non-pooled URL Alembic migrates through
#   PRODUCTION_URL        where the post-deployment checks look
#
# Rollback is in docs/deployment.md section 9. It is deliberately a human step:
# an automatic `alembic downgrade` in a failure path is a data-loss button.

# Manual until the Vercel project exists. Pushing to main would otherwise fail
# at `migrate` on every commit, because none of the secrets below are set yet —
# and the first deployment of anything should be a decision, not a side effect
# of a push. Once the project is linked and the production environment holds its
# secrets, add back:
#
#   push:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  # Never two deploys at once, and never cancel one halfway: a cancelled
  # migration leaves a schema nobody can describe.
  group: deploy-production
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.6"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: heimdall
          POSTGRES_PASSWORD: heimdall
          POSTGRES_DB: heimdall_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U heimdall -d heimdall_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://heimdall:heimdall@localhost:5432/heimdall_test
      ENVIRONMENT: test
      RUN_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras
      - run: uv run alembic upgrade head
      - run: uv run pytest -m integration

  journey:
    name: End-to-end journey
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: heimdall
          POSTGRES_PASSWORD: heimdall
          POSTGRES_DB: heimdall_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U heimdall -d heimdall_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://heimdall:heimdall@localhost:5432/heimdall_e2e
      ENVIRONMENT: local
      # The journey registers an account and drives it hard. Per-instance rate
      # limiting is a production guard, not a property under test here, and
      # leaving it on makes the suite fail on its own speed.
      RATE_LIMIT_ENABLED: "false"
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras
        working-directory: backend

      - name: Apply migrations
        run: uv run alembic upgrade head
        working-directory: backend

      - name: Start the API
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "api up"
              exit 0
            fi
            sleep 2
          done
          echo "the API never became healthy" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run the journey
        run: npm run e2e
        working-directory: frontend

      - name: Keep the trace when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  migrate:
    name: Migrate production
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration, journey]
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-extras

      # ENVIRONMENT is deliberately not set to `production` here. This job only
      # needs a database URL, and the production validators would additionally
      # demand AUTH_SECRET and the cookie settings — secrets a migration runner
      # has no reason to hold.
      - name: What the database is at now
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: uv run alembic current

      # Migrations go through the **direct** endpoint. Neon's pooled endpoint is
      # PgBouncer in transaction mode, which cannot hold the session-level
      # advisory lock Alembic takes. See docs/deployment.md section 4.
      - name: Apply migrations
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: uv run alembic upgrade head

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull the production environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed to $url"
    outputs:
      url: ${{ steps.deploy.outputs.url }}

  verify:
    name: Post-deployment checks
    runs-on: ubuntu-latest
    needs: [deploy]
    environment: production
    steps:
      - name: The API answers
        run: |
          url="${{ secrets.PRODUCTION_URL }}"
          curl -fsS "$url/health" | tee /dev/stderr | grep -q '"status":"ok"'

      - name: The API can reach its database
        run: |
          url="${{ secrets.PRODUCTION_URL }}"
          # /ready reports the database specifically, which is what distinguishes
          # "the function booted" from "the deployment works".
          curl -fsS "$url/ready" | tee /dev/stderr | grep -q '"status":"ok"'

      - name: A nested route serves the application, not a 404
        run: |
          url="${{ secrets.PRODUCTION_URL }}"
          # The SPA fallback: React Router owns the route, so a direct visit to a
          # deep link has to return index.html with a 200.
          code="$(curl -s -o /tmp/deep.html -w '%{http_code}' "$url/app/portfolios")"
          test "$code" = "200"
          grep -qi "<div id=\"root\"" /tmp/deep.html

      - name: The scheduled endpoint refuses an unauthenticated caller
        run: |
          url="${{ secrets.PRODUCTION_URL }}"
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{}' \
            "$url/api/v1/internal/monitoring/run")"
          # 401 or 403; anything in the 2xx range would mean the guard is off.
          test "$code" = "401" || test "$code" = "403"
